{% extends "base.html" %}

{% block title %}Log In | SkillBoost ATS{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
  <div class="p-8 rounded-3xl bg-dark-card border border-dark-border shadow-2xl relative">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl font-bold mx-auto mb-3">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white">Welcome Back</h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-2">Log in to view your scan reports and track your job matches.</p>
    </div>

    {% if error %}
      <div class="p-3.5 mb-6 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center font-medium">
        <i class="fa-solid fa-circle-exclamation mr-1.5"></i> {{ error }}
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1.5">Email Address</label>
        <input type="email" name="email" required placeholder="rahul@example.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-colors">
      </div>

      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1.5">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition-colors">
      </div>

      <button type="submit" class="w-full py-3.5 rounded-xl btn-gradient text-white font-bold text-sm shadow-xl shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 mt-2">
        <span>Sign In to Dashboard</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
      <span>Don't have an account yet?</span>
      <a href="/register" class="text-cyan-400 hover:text-cyan-300 font-semibold ml-1">Claim 1 Free Scan</a>
    </div>

  </div>
</div>
{% endblock %}
