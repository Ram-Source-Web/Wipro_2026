<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | SkillBoost Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0A0E17] text-slate-200 font-sans flex items-center justify-center min-h-screen px-4">
  <div class="max-w-md w-full p-8 rounded-3xl bg-[#111827] border border-slate-800 shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl font-bold mx-auto mb-3">
        R
      </div>
      <h1 class="text-2xl font-extrabold text-white">Owner Portal</h1>
      <p class="text-xs text-slate-400 mt-1">SkillBoost ATS & Agency Control Center</p>
    </div>

    {% if error %}
      <div class="p-3 mb-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center font-medium">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1">Username</label>
        <input type="text" name="username" required value="ram" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs font-mono text-slate-400 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-indigo-500">
      </div>
      <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all">
        Access Control Center
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800 text-center">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-300">← Back to public website</a>
    </div>
  </div>
</body>
</html>
